<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Admin | Category Management')}"></head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<main class="py-4">
    <div class="container">
        <!-- Breadcrumb & Header -->
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb small">
                <li class="breadcrumb-item"><a th:href="@{/admin}">Admin Dashboard</a></li>
                <li class="breadcrumb-item active" aria-current="page">Categories</li>
            </ol>
        </nav>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-0">Product Categories</h2>
                <small class="text-muted" th:text="${categories.size() + ' categories defined'}">Categories</small>
            </div>
            <a th:href="@{/admin}" class="btn btn-outline-secondary rounded-pill px-3">
                &larr; Admin Dashboard
            </a>
        </div>

        <div class="row g-4">
            <!-- Categories Table -->
            <div class="col-lg-7">
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                    <div class="table-responsive">
                        <table class="table align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-4">Icon</th>
                                    <th>Category Name</th>
                                    <th>Description</th>
                                    <th class="text-end pe-4">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="cat : ${categories}">
                                    <td class="ps-4">
                                        <div class="bg-primary-subtle text-primary rounded-circle d-inline-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                                            <i th:class="${'bi ' + (cat.icon ?: 'bi-tag')}"></i>
                                        </div>
                                    </td>
                                    <td>
                                        <strong th:text="${cat.name}">Category Name</strong>
                                    </td>
                                    <td class="small text-muted" th:text="${cat.description}">Description</td>
                                    <td class="text-end pe-4">
                                        <a th:href="@{/admin/categories/delete/{id}(id=${cat.id})}" 
                                           class="btn btn-sm btn-outline-danger rounded-pill" 
                                           onclick="return confirm('Are you sure you want to delete this category?')">
                                            <i class="bi bi-trash"></i>
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Add Category Card -->
            <div class="col-lg-5">
                <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                    <h5 class="fw-bold mb-3">Add New Category</h5>
                    <form th:action="@{/admin/categories/save}" th:object="${newCategory}" method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label small fw-semibold">Category Name *</label>
                            <input type="text" id="name" th:field="*{name}" class="form-control rounded-3" 
                                   placeholder="e.g. Footwear & Shoes" required>
                        </div>
                        <div class="mb-3">
                            <label for="icon" class="form-label small fw-semibold">Bootstrap Icon Class</label>
                            <input type="text" id="icon" th:field="*{icon}" class="form-control rounded-3" 
                                   placeholder="bi-tag">
                            <div class="form-text small">e.g. bi-laptop, bi-bag-check, bi-house-door, bi-book</div>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label small fw-semibold">Description</label>
                            <textarea id="description" th:field="*{description}" class="form-control rounded-3" rows="2" 
                                      placeholder="Brief category description"></textarea>
                        </div>
                        <div class="mb-4">
                            <label for="imageUrl" class="form-label small fw-semibold">Banner Image URL</label>
                            <input type="url" id="imageUrl" th:field="*{imageUrl}" class="form-control rounded-3" 
                                   placeholder="https://images.unsplash.com/photo-...">
                        </div>
                        <button type="submit" class="btn btn-primary rounded-pill w-100 fw-bold shadow">
                            <i class="bi bi-plus-lg me-1"></i> Create Category
                        </button>
                    </form>
                </div>
            </div>
        </div>

    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
