<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('NexStore | Contact & Support')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<main class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                    <div class="text-center mb-4">
                        <span class="bg-primary text-white p-3 rounded-4 d-inline-flex mb-3 shadow">
                            <i class="bi bi-headset fs-3"></i>
                        </span>
                        <h3 class="fw-bold mb-1">Customer Support & Helpdesk</h3>
                        <p class="text-muted small">Have any questions regarding orders or products? We're here to help!</p>
                    </div>

                    <form onsubmit="alert('Thank you! Your message has been received.'); return false;">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Your Name *</label>
                                <input type="text" class="form-control rounded-3" placeholder="John Doe" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold">Email Address *</label>
                                <input type="email" class="form-control rounded-3" placeholder="john@example.com" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Subject *</label>
                            <input type="text" class="form-control rounded-3" placeholder="Inquiry about order delivery or return" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-semibold">Message *</label>
                            <textarea class="form-control rounded-3" rows="4" placeholder="How can we assist you today?" required></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg rounded-pill w-100 fw-bold shadow">
                            <i class="bi bi-send me-1"></i> Send Inquiry
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
