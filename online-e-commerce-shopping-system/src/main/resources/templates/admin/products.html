<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Admin | Product Inventory Management')}"></head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<main class="py-4">
    <div class="container">
        <!-- Breadcrumb & Header -->
        <nav aria-label="breadcrumb" class="mb-3">
            <ol class="breadcrumb small">
                <li class="breadcrumb-item"><a th:href="@{/admin}">Admin Dashboard</a></li>
                <li class="breadcrumb-item active" aria-current="page">Products Inventory</li>
            </ol>
        </nav>

        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
            <div>
                <h2 class="fw-bold mb-0">Product Inventory</h2>
                <small class="text-muted" th:text="${products.size() + ' total products in catalog'}">Catalog</small>
            </div>
            <div>
                <a th:href="@{/admin/products/new}" class="btn btn-primary rounded-pill px-4 shadow-sm">
                    <i class="bi bi-plus-circle me-1"></i> Add New Product
                </a>
            </div>
        </div>

        <!-- Products Table -->
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th scope="col" class="ps-4">ID</th>
                            <th scope="col">Product</th>
                            <th scope="col">Category</th>
                            <th scope="col">Price</th>
                            <th scope="col">Stock</th>
                            <th scope="col">Status</th>
                            <th scope="col" class="text-end pe-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="prod : ${products}">
                            <td class="ps-4 text-muted small" th:text="${prod.id}">#1</td>
                            <td class="py-3">
                                <div class="d-flex align-items-center gap-3">
                                    <img th:src="${prod.imageUrl}" class="rounded-3 object-fit-cover shadow-sm" style="width: 50px; height: 50px;">
                                    <div>
                                        <a th:href="@{/products/{id}(id=${prod.id})}" target="_blank" 
                                           class="fw-bold text-dark text-decoration-none" th:text="${prod.name}">Product Name</a>
                                        <div class="small text-muted" th:if="${prod.featured}">
                                            <span class="badge bg-warning text-dark"><i class="bi bi-star-fill"></i> Featured</span>
                                        </div>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <span class="badge bg-light text-dark border" th:text="${prod.category?.name}">Category</span>
                            </td>
                            <td class="fw-bold" th:text="${'$' + #numbers.formatDecimal(prod.price, 1, 2)}">$99.99</td>
                            <td>
                                <span th:if="${prod.stockQuantity > 20}" class="badge bg-success-subtle text-success" th:text="${prod.stockQuantity + ' in stock'}">50</span>
                                <span th:if="${prod.stockQuantity <= 20 and prod.stockQuantity > 0}" class="badge bg-warning-subtle text-warning" th:text="${prod.stockQuantity + ' low stock'}">10</span>
                                <span th:if="${prod.stockQuantity <= 0}" class="badge bg-danger-subtle text-danger">Out of stock</span>
                            </td>
                            <td>
                                <span th:if="${prod.inStock}" class="badge bg-success">Active</span>
                                <span th:unless="${prod.inStock}" class="badge bg-secondary">Inactive</span>
                            </td>
                            <td class="text-end pe-4">
                                <div class="btn-group">
                                    <a th:href="@{/admin/products/edit/{id}(id=${prod.id})}" class="btn btn-sm btn-outline-secondary rounded-pill me-1" title="Edit Product">
                                        <i class="bi bi-pencil"></i> Edit
                                    </a>
                                    <a th:href="@{/admin/products/delete/{id}(id=${prod.id})}" class="btn btn-sm btn-outline-danger rounded-pill" 
                                       onclick="return confirm('Are you sure you want to delete this product?')" title="Delete Product">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
