<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('NexStore | Customer Sign In')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<main class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5">
                    <div class="text-center mb-4">
                        <span class="bg-primary text-white p-3 rounded-4 d-inline-flex mb-3 shadow">
                            <i class="bi bi-person-fill fs-3"></i>
                        </span>
                        <h3 class="fw-bold mb-1">Welcome Back</h3>
                        <p class="text-muted small">Sign in to manage orders, wishlist & account</p>
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="email" class="form-label small fw-semibold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                <input type="email" id="email" name="email" class="form-control border-start-0 ps-0" 
                                       placeholder="you@example.com" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label small fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                <input type="password" id="password" name="password" class="form-control border-start-0 ps-0" 
                                       placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg rounded-pill w-100 shadow fw-bold mb-3">
                            Sign In
                        </button>
                    </form>

                    <!-- 1-Click Demo Buttons for Fast Evaluation -->
                    <div class="border-top pt-3 mt-2 text-center">
                        <div class="small text-muted mb-2 fw-semibold">Quick Demo 1-Click Access:</div>
                        <div class="d-flex gap-2 justify-content-center">
                            <a th:href="@{/demo-login(role='admin')}" class="btn btn-outline-danger btn-sm rounded-pill flex-grow-1">
                                <i class="bi bi-shield-lock-fill me-1"></i> Demo Admin
                            </a>
                            <a th:href="@{/demo-login(role='customer')}" class="btn btn-outline-success btn-sm rounded-pill flex-grow-1">
                                <i class="bi bi-person-check-fill me-1"></i> Demo Customer
                            </a>
                        </div>
                    </div>

                    <div class="text-center mt-4 small text-muted">
                        Don't have an account? 
                        <a th:href="@{/register}" class="fw-bold text-primary text-decoration-none">Sign Up</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
