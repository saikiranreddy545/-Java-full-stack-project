<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('NexStore | Create Account')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<div th:replace="~{fragments/alerts :: alerts}"></div>

<main class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5">
                    <div class="text-center mb-4">
                        <span class="bg-primary text-white p-3 rounded-4 d-inline-flex mb-3 shadow">
                            <i class="bi bi-person-plus-fill fs-3"></i>
                        </span>
                        <h3 class="fw-bold mb-1">Create an Account</h3>
                        <p class="text-muted small">Join thousands of shoppers on NexStore</p>
                    </div>

                    <form th:action="@{/register}" method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label small fw-semibold">Full Name *</label>
                            <input type="text" id="name" name="name" class="form-control rounded-3" 
                                   placeholder="John Doe" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label small fw-semibold">Email Address *</label>
                            <input type="email" id="email" name="email" class="form-control rounded-3" 
                                   placeholder="john@example.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label small fw-semibold">Password *</label>
                            <input type="password" id="password" name="password" class="form-control rounded-3" 
                                   placeholder="Create a strong password" required>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label small fw-semibold">Phone Number</label>
                            <input type="tel" id="phone" name="phone" class="form-control rounded-3" 
                                   placeholder="+1 (555) 000-1234">
                        </div>

                        <div class="mb-4">
                            <label for="address" class="form-label small fw-semibold">Default Shipping Address</label>
                            <textarea id="address" name="address" class="form-control rounded-3" rows="2" 
                                      placeholder="123 Street Name, City, Country"></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg rounded-pill w-100 shadow fw-bold mb-3">
                            Create Account
                        </button>
                    </form>

                    <div class="text-center mt-3 small text-muted">
                        Already have an account? 
                        <a th:href="@{/login}" class="fw-bold text-primary text-decoration-none">Sign In</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
